# CI — official patterns per GitHub Actions docs:
# docs.github.com/en/actions/using-containerized-services/creating-postgresql-service-containers
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend (lint, migrations, tests on ${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The suite runs on BOTH backends: SQLite is the local-dev default,
        # Postgres is the production target. For weeks the job NAME said
        # "tests on Postgres" while only the alembic/boot steps touched it —
        # the pytest steps silently ran on SQLite (reviewer finding). A
        # backend divergence must fail CI, not surface during WO1.
        database: [sqlite, postgres]
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: jobfinderos_ci
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies (locked)
        run: pip install -r requirements.lock ruff pytest

      - name: Lint (imports + errors)
        run: ruff check --select I,F app/ tests/ scripts/

      - name: Alembic migrations apply on real Postgres
        if: matrix.database == 'postgres'
        env:
          DATABASE_URL: postgresql+psycopg://postgres:ci@localhost:5432/jobfinderos_ci
          DEBUG: "true"  # CI is dev-grade; production guards relaxed by design
        run: |
          python -m alembic upgrade head
          python - <<'EOF'
          import os
          from sqlalchemy import create_engine, inspect
          from app.core.database import normalize_postgres_url
          # Every engine-construction path normalizes (WO-11 review): a bare
          # postgresql:// here would resolve to psycopg2, which is not installed.
          eng = create_engine(normalize_postgres_url(os.environ["DATABASE_URL"]))
          tables = set(inspect(eng).get_table_names())
          expected = {"profiles", "job_postings", "match_results", "application_drafts",
                      "applications", "scrape_runs", "users", "alembic_version"}
          missing = expected - tables
          assert not missing, f"missing tables: {missing}"
          print("schema OK:", sorted(tables))
          EOF

      - name: App boots against Postgres (schema idempotent, auth mounts)
        if: matrix.database == 'postgres'
        env:
          DATABASE_URL: postgresql+psycopg://postgres:ci@localhost:5432/jobfinderos_ci
          GLM_API_KEY: ""
          DEBUG: "true"
        run: |
          python -c "
          from fastapi.testclient import TestClient
          from app.main import app
          with TestClient(app) as c:
              r = c.get('/health'); assert r.json()['database'] == 'up', r.text
              r = c.post('/api/v1/auth/register', json={'email':'ci@test.com','password':'C1Pass!xxxx'})
              assert r.status_code == 201, r.text
              r = c.post('/api/v1/auth/jwt/login', data={'username':'ci@test.com','password':'C1Pass!xxxx'})
              assert r.status_code == 200, r.text
              token = r.json()['access_token']
              r = c.get('/api/v1/users/me', headers={'Authorization': f'Bearer {token}'})
              assert r.json()['email'] == 'ci@test.com', r.text
              print('auth roundtrip on Postgres: OK')
          "

      - name: Alembic runs with ONLY DATABASE_URL (production migration shape)
        if: matrix.database == 'postgres'
        env:
          DATABASE_URL: postgresql+psycopg://postgres:ci@localhost:5432/jobfinderos_ci
        run: |
          # A migration step (Render pre-deploy, init container) carries the
          # database URL and little else. This step exports NOTHING else —
          # no DEBUG, no AUTH_SECRET — so the production guards would kill it
          # if alembic ever again imported full app config. CI's other steps
          # set DEBUG=true and can never catch this class.
          python -m alembic upgrade head
          python - <<'EOF'
          import os
          from sqlalchemy import create_engine, inspect
          from app.core.dburl import normalize_postgres_url
          eng = create_engine(normalize_postgres_url(os.environ["DATABASE_URL"]))
          assert "match_results" in inspect(eng).get_table_names()
          print("minimal-env migrations: OK")
          EOF

      # Full suite, BOTH legs. The three per-module steps that used to
      # sit here ran test_units/test_multiuser/test_flow only —
      # test_delta, test_radius, test_taxonomy, test_calibration and the
      # test_fabrication gate never ran in CI (reviewer finding OPS-3).
      # conftest.py owns DATABASE_URL from TEST_DATABASE_URL per leg, so
      # one command covers every module. The opt-in live-API tests stay
      # free: RUN_CALIBRATION / RUN_FABRICATION are never set here.
      - name: Test suite (all modules in tests/)
        env:
          TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql+psycopg://postgres:ci@localhost:5432/jobfinderos_ci' || '' }}
        run: PYTHONPATH=. python -m pytest tests/ -q

      # test_flow.py is a standalone script with no pytest items — under
      # `pytest tests/` it is imported but its main() never runs. Keep a
      # dedicated step so the full profile -> match -> decide -> draft ->
      # submit journey (mocked AI) still executes on both legs. Standalone
      # it reads DATABASE_URL directly (conftest's TEST_DATABASE_URL
      # convention postdates it), so export the throwaway CI Postgres on
      # that leg; on sqlite its own test_flow.db default applies. Never
      # set DATABASE_URL to '' — pydantic would take the empty string
      # over the sqlite default.
      - name: End-to-end flow test (script, mocked AI)
        run: |
          if [ "${{ matrix.database }}" = "postgres" ]; then
            export DATABASE_URL=postgresql+psycopg://postgres:ci@localhost:5432/jobfinderos_ci
          fi
          PYTHONPATH=. python tests/test_flow.py

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t jobfinderos-backend:ci backend/
      - name: Image smoke (imports, boots schema)
        run: docker run --rm --entrypoint python -e DEBUG=true jobfinderos-backend:ci -c "import app.main; print('container OK')"
      # AI-12: the true production-shape typography check. The unit suite
      # runs on ubuntu runners that already have DejaVu fonts, so only this
      # step catches "image lost its fonts" — python:3.12-slim ships none,
      # and before fonts-dejavu-core every em-dash/curly quote rendered as
      # "?" in employer-facing PDFs. Renders inside the BUILT image and
      # extracts the text back out with pdfplumber (already a locked dep).
      - name: Image smoke (PDF curly typography survives render — AI-12)
        run: |
          docker run --rm -i --entrypoint python jobfinderos-backend:ci - <<'PY'
          import io
          import pdfplumber
          from app.services import pdf_service
          text = ("I\u2019m excited \u2014 truly \u2014 about the role; "
                  "the team\u2019s \u201cfirst principles\u201d culture.")
          data = pdf_service.cover_letter_pdf(text, "CI Candidate")
          with pdfplumber.open(io.BytesIO(data)) as pdf:
              extracted = "\n".join(p.extract_text() or "" for p in pdf.pages)
          for ch in ("\u2014", "\u2019", "\u201c", "\u201d"):
              assert ch in extracted, repr(extracted)
          assert "?" not in extracted, repr(extracted)
          print("container PDF typography OK:", extracted[:90])
          PY
      - name: Build hunt image (WO-07 cron shape)
        run: docker build -f backend/Dockerfile.hunt -t jobfinderos-hunt:ci backend/
      - name: Hunt image smoke (--once CLI parses, exits clean)
        run: docker run --rm --entrypoint python -e DEBUG=true jobfinderos-hunt:ci -m app.services.worker --help
      # Same AI-12 check on the hunt image: it shares the API image's
      # layers, so this proves the font layer (not just the CMD) is intact.
      - name: Hunt image smoke (PDF curly typography — AI-12)
        run: |
          docker run --rm -i --entrypoint python jobfinderos-hunt:ci - <<'PY'
          import io
          import pdfplumber
          from app.services import pdf_service
          text = "hunt \u2014 one-shot \u2014 \u201cfonts\u201d check"
          data = pdf_service.tailored_cv_pdf(text, "CI Candidate")
          with pdfplumber.open(io.BytesIO(data)) as pdf:
              extracted = "\n".join(p.extract_text() or "" for p in pdf.pages)
          for ch in ("\u2014", "\u201c", "\u201d"):
              assert ch in extracted, repr(extracted)
          assert "?" not in extracted, repr(extracted)
          print("hunt container PDF typography OK:", extracted[:90])
          PY

  blueprint:
    name: Render blueprint (render.yaml valid)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: render.yaml parses + invariants
        run: |
          python - <<'EOF'
          import yaml
          with open("render.yaml") as f:
              spec = yaml.safe_load(f)
          services = {s["name"]: s for s in spec["services"]}
          api, hunt = services["jobfinderos-api"], services["jobfinderos-hunt"]
          assert api["type"] == "web" and api["runtime"] == "docker"
          assert api["healthCheckPath"] == "/health"
          assert api["plan"] == "free"
          # Hunt cadence: the runbook documents twice daily (06:00/18:00
          # UTC) and render.yaml declared hourly until ab69906 aligned it
          # — this assertion was left at "0 * * * *" and went red on every
          # push. Assert the DOCUMENTED value so accidental drift in
          # render.yaml still fails loudly; if you change the cadence on
          # purpose, update this expectation, HUNT_TIMES_UTC, and
          # docs/deploy/WO-07-runbook.md in the same commit.
          DOCUMENTED_SCHEDULE = "0 6,18 * * *"  # twice daily, UTC
          assert hunt["type"] == "cron", (
              f"jobfinderos-hunt must stay a cron job, got {hunt.get('type')!r}")
          assert hunt["schedule"] == DOCUMENTED_SCHEDULE, (
              f"jobfinderos-hunt schedule drifted: render.yaml declares "
              f"{hunt.get('schedule')!r} but the documented cadence is "
              f"{DOCUMENTED_SCHEDULE!r} (twice daily, 06:00/18:00 UTC — "
              "docs/deploy/WO-07-runbook.md). If intentional, update the "
              "runbook, HUNT_TIMES_UTC and this assertion together.")
          # render.yaml's own comments: HUNT_TIMES_UTC powers the API's
          # next-hunt countdown and must stay in sync with the schedule.
          api_env = {v["key"]: v for v in api.get("envVars", [])}
          hunt_times = api_env["HUNT_TIMES_UTC"]["value"]
          hours = sorted({int(p) for p in hunt["schedule"].split()[1].split(",")})
          assert hunt_times == ",".join(f"{h:02d}:00" for h in hours), (
              f"jobfinderos-hunt schedule ({hunt['schedule']!r}) and the API's "
              f"HUNT_TIMES_UTC ({hunt_times!r}) disagree — the dashboard's "
              "next-hunt countdown would lie about when hunts run.")
          # docker paths resolve relative to ROOTDIR (observed on the first
          # real Render deploy — repo-root paths produced /src/backend/backend)
          assert api["rootDir"] == "backend"
          assert api["dockerfilePath"] == "./Dockerfile"
          assert hunt["dockerfilePath"] == "./Dockerfile.hunt"
          # No secret may carry a literal value (render.com/docs/blueprint-spec:
          # sync:false prompts at creation; generateValue makes one)
          for s in spec["services"]:
              for v in s.get("envVars", []):
                  if v["key"] in {"DATABASE_URL", "GLM_API_KEY", "SUPABASE_URL",
                                  "SUPABASE_SERVICE_KEY", "AUTH_SECRET",
                                  "RESEND_API_KEY"}:
                      assert v.get("sync") is False or v.get("generateValue"), (
                          f"{s['name']}/{v['key']} must be sync:false or generateValue")
                  assert "value" not in v or v["key"] not in {
                      "DATABASE_URL", "GLM_API_KEY", "SUPABASE_URL",
                      "SUPABASE_SERVICE_KEY", "RESEND_API_KEY"}, \
                      f"secret {v['key']} has a literal value in render.yaml"
          print("render.yaml invariants OK:", list(services))
          EOF

  frontend:
    name: Frontend (type-check + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit --noUnusedLocals --noUnusedParameters

      - name: Build (static export — WO-07 Cloudflare Pages shape)
        env:
          NEXT_PUBLIC_API_URL: https://jobfinderos-api.onrender.com
        run: npm run build

      - name: Export artifact check
        run: |
          test -f out/index.html
          test -f out/login.html
          # NEXT_PUBLIC_* inlines into the CLIENT BUNDLE (chunks), not the
          # HTML — assert the API URL actually reached the emitted JS
          grep -rq 'jobfinderos-api.onrender.com' out/_next/static/
          echo "static export OK: out/ with API URL inlined in the bundle"
