# DEV/CI lock (INFRA-30) — a strict SUPERSET of requirements.lock:
# every prod pin, byte-identical, plus the dev toolchain (pytest, ruff,
# and pytest's own private deps iniconfig/pluggy, which ride along so
# the prod image never carries them).
#
# Who installs what:
#   - CI (and local dev): this file — lint + the test suite need the toolchain.
#   - Production Docker images (Dockerfile, Dockerfile.hunt): requirements.lock
#     ONLY — pytest/ruff used to ship in both images (INFRA-30).
#
# Drift is caught in CI: scripts/check_dev_lock.py asserts the superset
# property AND that the toolchain is dev-only (never re-added to the prod
# lock by accident). pygments stays a PROD pin (mako/httpx import it at
# runtime); packaging stays too — only pytest declares it today, but it is
# the classic ambient dependency and not worth pruning risk.

