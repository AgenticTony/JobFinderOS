# WO-07 production topology — Render blueprint (official spec:
# render.com/docs/blueprint-spec).
#
# Cost floor (user constraint: cheapest credible production):
#   - API: the ONLY always-on process, on a free instance (512MB, spins
#     down after 15 min idle, ~1 min cold start — acceptable pre-revenue).
#   - Hunts: a twice-daily CRON JOB (06:00 + 18:00 UTC), not a 24/7
#     worker. Cron runs are billed per second of ACTIVE runtime
#     ($1/mo minimum; 0.5c-512mb ≈ $0.00016/min) — two ~10-min hunts a
#     day sit inside the minimum vs $7/mo for a 24/7 worker.
#     worker --once (Dockerfile.hunt) claims the DB hunt lock, runs one
#     cycle, exits.
#   - Postgres: Supabase (WO-03), not a Render database.
#   - Frontend: Cloudflare Pages (static export, free) — separate deploy,
#     see docs/deploy/WO-07-runbook.md.
#
# Secrets are `sync: false` — Render prompts for them ONCE during
# initial Blueprint creation (never commit real values here).
services:
  # ── API (web service) ────────────────────────────────────────────
  - type: web
    name: jobfinderos-api
    runtime: docker
    rootDir: backend
    # dockerfilePath/dockerContext resolve relative to ROOTDIR (observed on
    # the first real deploy: repo-root paths made Render look for
    # /src/backend/backend — the blueprint spec's "relative to the repo
    # root" does not hold when rootDir is set)
    dockerfilePath: ./Dockerfile
    dockerContext: ./
    plan: free
    # Same side of the pond as Supabase eu-west-1 (Frankfurt) — keeps the
    # data path intra-EU (GDPR/WO-06 residency). If unavailable at
    # creation time, oregon is the fallback.
    region: frankfurt
    healthCheckPath: /health   # DB-connectivity probe (app/main.py) — a
                               # failed check fails the deploy (render.com/docs/health-checks)
    autoDeploy: false          # no deploy before CI is green; re-enable once CI is trusted
    envVars:
      # Database — Supabase session pooler URL from backend/.env
      # (WO-12: session mode, not transaction — prepare_threshold caveat)
      - key: DATABASE_URL
        sync: false
      # AI — Z.ai GLM (scoring + tailoring + judge)
      - key: GLM_API_KEY
        sync: false
      # Beta (2026-09-01): lift the trial scoring caps on Render — the GLM
      # key is a flat-rate subscription, so testers are effectively
      # uncapped. Dashboard sets e.g. 9999/9999; remove the values after
      # beta to reinstate the 25/10 code defaults (CLAUDE.md open items).
      - key: TRIAL_DAILY_SCORE_CAP
        sync: false
      - key: TRIAL_DAY1_SCORE_CAP
        sync: false
      # Auth — Render generates a 256-bit value ONCE and persists it
      # across deploys (blueprint-spec: generateValue). DEBUG=false
      # rejects weak/short secrets at boot (config.py _production_guards).
      - key: AUTH_SECRET
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: ENVIRONMENT
        value: production
      # P0-3/P1-8: the per-IP auth throttles (signup factory / password
      # spray) key on the client IP. Render's edge proxies EVERY request,
      # so request.client.host would be the proxy's address — every user
      # sharing one 10-signups/day bucket. True here because a proxy front
      # is guaranteed on Render web services (the app then prefers
      # True-Client-IP, falling back to X-Forwarded-For — see
      # backend/app/api/deps.py _client_ip); a LITERAL value so it
      # survives service recreation (OPS-7 sync:false lesson). The cron
      # service never serves HTTP, so it doesn't need the flag.
      - key: TRUST_PROXY_HEADERS
        value: "true"
      # CORS — explicit origins only (allow_credentials=True forbids *).
      # Set to the Pages URL after the frontend project exists, e.g.
      # https://jobfinderos.pages.dev[,https://www.yourdomain.com]
      - key: CORS_ORIGINS
        sync: false
      # CV storage — Render's free filesystem is EPHEMERAL (lost on every
      # deploy/restart/spin-down), so CVs go to Supabase Storage
      # (private bucket; ops/provision_supabase_storage.py provisions it).
      - key: STORAGE_BACKEND
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      # Email apply (Resend) — profiles /status reports email_apply_enabled
      # from RESEND_API_KEY; without these the flagship send-with-PDFs
      # loop is dead in production and drafts can only fall back to
      # 'Apply in browser' (P0-6). APPLY_FROM_EMAIL must be a
      # Resend-verified sender.
      - key: RESEND_API_KEY
        sync: false
      - key: APPLY_FROM_EMAIL
        sync: false
      # Beta onboarding drip (2026-09-03): fire user.created at signup for
      # the Resend daily-series automation. Flip to "true" in the same
      # change that enables the automation in Resend's dashboard.
      - key: ONBOARDING_EMAILS_ENABLED
        value: "false"
      # Scraping + per-source keys (empty keys = source self-disables)
      - key: SCRAPE_SOURCES
        value: arbeitnow,remotive,jobicy,workingnomads,jobtech,reed
      - key: JOBTECH_API_KEY
        sync: false
      - key: REED_API_KEY
        sync: false
      - key: SENTRY_DSN     # empty = off (WO-05); EU region project when set
        sync: false
      # Hunts run in the CRON service, never the API (WO-04: two API
      # replicas must never race the scheduler; default false anyway)
      - key: ENABLE_SCHEDULER
        value: "false"
      # The cron service's hunt times (below) — /api/v1/pipeline/status
      # uses them to power the dashboard's next-hunt countdown when the
      # in-process scheduler is off. Keep in sync with the cron schedule.
      - key: HUNT_TIMES_UTC
        value: "06:00,18:00"

  # ── Hunt cron (one-shot) ─────────────────────────────────────────
  - type: cron
    name: jobfinderos-hunt
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile.hunt
    dockerContext: ./
    plan: 0.5c-512mb          # metered per-second; two short runs/day ≈ the
                              # $1/mo minimum
    schedule: "0 6,18 * * *"  # twice daily, UTC (render.com/docs/cronjobs);
                              # keep HUNT_TIMES_UTC on the API in sync
    # EU residency (WO-06 posture): the hunt pulls user CV/profile data
    # from Supabase into memory while matching — it must NOT run in a US
    # region. Region is immutable after creation: recreating the service
    # is the only way to move it.
    region: frankfurt
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GLM_API_KEY
        sync: false
      # Beta (2026-09-01): lift the trial scoring caps on Render — the GLM
      # key is a flat-rate subscription, so testers are effectively
      # uncapped. Dashboard sets e.g. 9999/9999; remove the values after
      # beta to reinstate the 25/10 code defaults (CLAUDE.md open items).
      - key: TRIAL_DAILY_SCORE_CAP
        sync: false
      - key: TRIAL_DAY1_SCORE_CAP
        sync: false
      # Settings validates AUTH_SECRET even in the worker (DEBUG=false
      # guard is global); the worker never signs tokens, its value just
      # has to exist and be strong.
      - key: AUTH_SECRET
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: ENVIRONMENT
        value: production
      - key: SCRAPE_SOURCES
        value: arbeitnow,remotive,jobicy,workingnomads,jobtech,reed
      - key: JOBTECH_API_KEY
        sync: false
      - key: REED_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
